name: CI

# Checks every push to main and every pull request. Nothing is deployed from
# here: Coolify deploys the app from the repository. Android releases are built
# by release.yaml when a v* tag is pushed.
#
# Secrets/variables used (all optional for CI): see docs/ci_ES.md / docs/ci.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Commits for Secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER~1..$PUSH_AFTER"
          fi
          echo "Scanning $range"
          bash scripts/check-secrets.sh --range "$range"

  api:
    name: API (Go)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Check Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit Tests
        run: go test ./...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            tests/go.sum

      # Throw-away credentials generated on the fly for the Firebase emulator.
      - name: Generate Firebase Credentials
        run: |
          bash tests/generate-firebase-credentials.sh tests/firebase-credentials.json
          echo "FIREBASE_CREDENTIALS=$(jq -c . tests/firebase-credentials.json)" >> "$GITHUB_ENV"

      - name: Generate Adapter Certificates
        run: bash tests/generate-adapter-certificates.sh tests/certs

      - name: Start Services
        working-directory: ./tests
        run: docker compose up -d --build

      - name: Wait for Healthy Services
        working-directory: ./tests
        run: |
          echo "Waiting for MongoDB to be healthy..."
          for i in $(seq 1 20); do
            if docker compose exec mongodb mongosh --eval "db.runCommand('ping').ok" --quiet >/dev/null 2>&1; then
              echo "MongoDB is healthy!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "MongoDB failed to become healthy"
              docker compose logs mongodb
              exit 1
            fi
            sleep 3
          done

          echo "Waiting for API to be healthy..."
          for i in $(seq 1 40); do
            if docker compose exec api curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "API failed to become healthy"
              docker compose logs api
              exit 1
            fi
            sleep 5
          done

      - name: Seed Database
        working-directory: ./tests
        run: |
          SEED_CONTAINER_ID=$(docker compose ps --all --quiet seed)
          if [ -z "$SEED_CONTAINER_ID" ]; then
            echo "::error::Seed container not found"
            exit 1
          fi
          SEED_EXIT_CODE=$(docker wait "$SEED_CONTAINER_ID")
          if [ "$SEED_EXIT_CODE" != "0" ]; then
            echo "::error::Database seeding failed with exit code $SEED_EXIT_CODE"
            exit 1
          fi
          sleep 2

      - name: Run Handler Integration Tests
        working-directory: ./api
        env:
          USER_API_KEY: test-user-api-key
        run: go test -tags integration -v -timeout 60s ./pkg/handlers

      - name: Run End-to-End Integration Tests
        working-directory: ./tests
        run: go test -v -timeout 300s ./...

      - name: Collect Service Logs on Failure
        if: failure()
        working-directory: ./tests
        run: docker compose logs --tail 200

      - name: Stop Services
        if: always()
        working-directory: ./tests
        run: docker compose down -v

  web:
    name: Web (Nuxt)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test

      # Public build-time values only (no secrets). Optional repository
      # variables let you build with your real domain.
      - name: Generate Static Site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.com' }}
          APP_URL: ${{ vars.APP_URL || 'https://example.com' }}
          APP_ENV: production
        run: pnpm run generate

  android:
    name: Android App
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Uses your real google-services.json when the GOOGLE_SERVICES_JSON_B64
      # secret exists (it is not available to pull requests from forks);
      # otherwise a placeholder that is only good enough to compile.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "Using google-services.json from secrets"
          else
            echo "::notice::GOOGLE_SERVICES_JSON_B64 not set, using a compile-only placeholder"
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.nerus.httpsms" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Build and Test
        env:
          HTTPSMS_DEFAULT_SERVER_URL: ${{ vars.HTTPSMS_DEFAULT_SERVER_URL }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Remove google-services.json
        if: always()
        run: rm -f app/google-services.json

  docker:
    name: Docker Images
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build API Image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t httpsms-api:ci ./api

      - name: Build Web Image
        run: docker build -t httpsms-web:ci ./web
