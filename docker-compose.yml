# =============================================================================
# httpSMS – Docker Compose (Coolify-ready)
# =============================================================================
#
# USAGE:
#   1. In Coolify → New Resource → Docker Compose → point to your Git repo.
#   2. Coolify will detect this file automatically.
#   3. Set all required environment variables in Coolify's "Environment Variables"
#      panel for each service (see descriptions below).
#   4. Deploy.
#
#   For local development:
#     cp .env.example .env    # fill in your values
#     docker compose up --build
#
# NOTES:
#   - All configuration is via environment variables (no env_file references
#     to gitignored files), which is what Coolify requires.
#   - The web frontend is a static SPA built at image build time. Firebase/app
#     config must be provided as build ARGs so Nuxt can bake them in.
#   - Coolify will auto-generate HTTPS via Traefik; you only need to set the
#     public domain in Coolify's service settings.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-httpsms}
      POSTGRES_USER: ${POSTGRES_USER:-httpsms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis Cache / Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # httpSMS API  (Go / Fiber)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      # ── Core ────────────────────────────────────────────────────────────
      ENV: ${ENV:-local}
      API_PORT: ${API_PORT:-8000}  # Defines external host port. Added here so Coolify detects it.
      APP_PORT: "8000"             # Internal port where Go listens. Do not change.
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: ${APP_NAME:-httpSMS}
      SWAGGER_HOST: ${SWAGGER_HOST:-localhost:8000}

      # ── Database & Cache ────────────────────────────────────────────────
      DATABASE_URL: postgresql://${POSTGRES_USER:-httpsms}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-httpsms}
      DATABASE_URL_DEDICATED: postgresql://${POSTGRES_USER:-httpsms}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-httpsms}
      REDIS_URL: redis://redis:6379

      # ── Firebase ────────────────────────────────────────────────────────
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}

      # ── Event Queue (system user) ──────────────────────────────────────
      EVENTS_QUEUE_TYPE: ${EVENTS_QUEUE_TYPE:-emulator}
      EVENTS_QUEUE_NAME: ${EVENTS_QUEUE_NAME:-events-local}
      EVENTS_QUEUE_ENDPOINT: ${EVENTS_QUEUE_ENDPOINT:-http://localhost:8000/v1/events}
      EVENTS_QUEUE_USER_API_KEY: ${EVENTS_QUEUE_USER_API_KEY:-}
      EVENTS_QUEUE_USER_ID: ${EVENTS_QUEUE_USER_ID:-}
      EVENTS_QUEUE_USER_EMAIL: ${EVENTS_QUEUE_USER_EMAIL:-system@httpsms.local}

      # ── SMTP / Email ───────────────────────────────────────────────────
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-httpSMS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@httpsms.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}

      # ── Entitlements ────────────────────────────────────────────────────
      ENTITLEMENT_ENABLED: ${ENTITLEMENT_ENABLED:-false}
      USE_HTTP_LOGGER: ${USE_HTTP_LOGGER:-true}

      # ── Cloudflare Turnstile ────────────────────────────────────────────
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}

      # ── Optional: Soketi (real-time frontend updates) ───────────────
      SOKETI_APP_ID: ${SOKETI_APP_ID:-app-id}
      SOKETI_KEY: ${SOKETI_KEY:-app-key}
      SOKETI_SECRET: ${SOKETI_SECRET:-app-secret}
      SOKETI_CLUSTER: ${SOKETI_CLUSTER:-mt1}
      SOKETI_HOST: ${SOKETI_HOST:-soketi:6001}
      SOKETI_SECURE: ${SOKETI_SECURE:-false}
      ENABLE_BILLING: ${ENABLE_BILLING:-false}

      # ── Optional: Axiom observability ───────────────────────────────────
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET_EVENTS: ${AXIOM_DATASET_EVENTS:-}
      AXIOM_DATASET_METRICS: ${AXIOM_DATASET_METRICS:-}

      # ── Optional: GCS for MMS attachments ───────────────────────────────
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}

  # ---------------------------------------------------------------------------
  # Soketi WebSockets (Reemplaza a Pusher externo)
  # ---------------------------------------------------------------------------
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    environment:
      SOKETI_DEBUG: '1'
      SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID:-app-id}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_KEY:-app-key}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_SECRET:-app-secret}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # httpSMS Web UI  (Nuxt SPA → nginx)
  # ---------------------------------------------------------------------------
  # The Nuxt SPA bakes environment at BUILD TIME via `pnpm run generate`.
  # Therefore, Firebase/app config must be passed as build args.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
        APP_URL: ${APP_URL:-http://localhost:3000}
        APP_NAME: ${APP_NAME:-httpSMS}
        APP_GITHUB_URL: ${APP_GITHUB_URL:-https://github.com/NdoleStudio/httpsms}
        APP_DOCUMENTATION_URL: ${APP_DOCUMENTATION_URL:-https://docs.httpsms.com}
        APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-https://github.com/NdoleStudio/httpsms/releases/latest/download/HttpSms.apk}
        APP_ENV: ${APP_ENV:-production}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
        CLOUDFLARE_TURNSTILE_SITE_KEY: ${CLOUDFLARE_TURNSTILE_SITE_KEY:-}
        SOKETI_KEY: ${SOKETI_KEY:-app-key}
        SOKETI_CLUSTER: ${SOKETI_CLUSTER:-mt1}
        USE_SOKETI: ${USE_SOKETI:-true}
        ENABLE_BILLING: ${ENABLE_BILLING:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      soketi:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      WEB_PORT: ${WEB_PORT:-3000} # Defines external host port. Added here so Coolify detects it.

volumes:
  postgres_data:
  redis_data:
